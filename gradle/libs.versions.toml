[versions]
# ── Kotlin / build tooling ──────────────────────────────────────────────────
agp              = "8.7.3"
kotlin           = "2.1.0"
ksp              = "2.1.0-1.0.29"
# Kotlin Compose Compiler is now bundled with the Kotlin plugin (>= 2.0).
# No explicit compose-compiler version is needed when using the
# `kotlin.plugin.compose` plugin.

# ── AndroidX core ───────────────────────────────────────────────────────────
coreKtx          = "1.15.0"
activityCompose  = "1.9.3"
lifecycle        = "2.8.7"
splash           = "1.0.1"
securityCrypto   = "1.1.0-alpha06"

# ── Compose ─────────────────────────────────────────────────────────────────
composeBom       = "2024.12.01"
navigationCompose= "2.8.5"
material3Adaptive= "1.0.0"

# ── Hilt ────────────────────────────────────────────────────────────────────
hilt             = "2.53"
hiltNavigation   = "1.2.0"

# ── Persistence ─────────────────────────────────────────────────────────────
room             = "2.6.1"
dataStore        = "1.1.1"

# ── Networking ──────────────────────────────────────────────────────────────
retrofit         = "2.11.0"
okhttp           = "4.12.0"
kotlinxSerialization = "1.7.3"
retrofitSerialization = "1.0.0"

# ── AI / Gemini ─────────────────────────────────────────────────────────────
generativeAi     = "0.9.0"

# ── Images / media ──────────────────────────────────────────────────────────
coil             = "2.7.0"
cameraX          = "1.4.1"
mlkitBarcode     = "17.3.0"

# ── Background ──────────────────────────────────────────────────────────────
workManager      = "2.10.0"
hiltWork         = "1.2.0"

# ── Testing ─────────────────────────────────────────────────────────────────
junit            = "4.13.2"
androidxTest     = "1.6.1"
espresso         = "3.6.1"

[libraries]
# ── AndroidX core ──
androidx-core-ktx        = { module = "androidx.core:core-ktx",          version.ref = "coreKtx" }
androidx-activity-compose= { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx= { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose= { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose= { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-splashscreen    = { module = "androidx.core:core-splashscreen", version.ref = "splash" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

# ── Compose ──
androidx-compose-bom     = { module = "androidx.compose:compose-bom",     version.ref = "composeBom" }
androidx-compose-ui      = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics= { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview= { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling= { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-material3= { module = "androidx.compose.material3:material3" }
androidx-compose-material3-window-size= { module = "androidx.compose.material3:material3-window-size-class" }
androidx-compose-material-icons-extended= { module = "androidx.compose.material:material-icons-extended" }
androidx-navigation-compose= { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# ── Hilt ──
hilt-android             = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler            = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose= { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation" }
androidx-hilt-work       = { module = "androidx.hilt:hilt-work",    version.ref = "hiltWork" }
androidx-hilt-work-compiler= { module = "androidx.hilt:hilt-compiler", version.ref = "hiltWork" }

# ── Persistence ──
androidx-room-runtime    = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx        = { module = "androidx.room:room-ktx",     version.ref = "room" }
androidx-room-compiler   = { module = "androidx.room:room-compiler",version.ref = "room" }
androidx-datastore-preferences= { module = "androidx.datastore:datastore-preferences", version.ref = "dataStore" }

# ── Networking ──
retrofit                 = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
okhttp                   = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging           = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit-kotlinx-serialization= { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }
kotlinx-serialization-json= { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# ── AI / Gemini ──
google-generativeai      = { module = "com.google.ai.client.generativeai:generativeai", version.ref = "generativeAi" }

# ── Images / camera ──
coil-compose             = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
androidx-camera-core     = { module = "androidx.camera:camera-core", version.ref = "cameraX" }
androidx-camera-camera2  = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle= { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view     = { module = "androidx.camera:camera-view", version.ref = "cameraX" }
mlkit-barcode-scanning   = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }

# ── Background ──
androidx-work-runtime-ktx= { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }

# ── Testing ──
junit                    = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit  = { module = "androidx.test.ext:junit", version.ref = "androidxTest" }
androidx-test-espresso-core= { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4= { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest= { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application      = { id = "com.android.application",               version.ref = "agp" }
android-library          = { id = "com.android.library",                   version.ref = "agp" }
kotlin-android           = { id = "org.jetbrains.kotlin.android",           version.ref = "kotlin" }
kotlin-compose           = { id = "org.jetbrains.kotlin.plugin.compose",   version.ref = "kotlin" }
kotlin-serialization     = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                      = { id = "com.google.devtools.ksp",                version.ref = "ksp" }
hilt                     = { id = "com.google.dagger.hilt.android",         version.ref = "hilt" }

[bundles]
compose = [
  "androidx-compose-ui",
  "androidx-compose-ui-graphics",
  "androidx-compose-ui-tooling-preview",
  "androidx-compose-material3",
  "androidx-compose-material3-window-size",
  "androidx-compose-material-icons-extended",
]
networking = [
  "retrofit",
  "okhttp",
  "okhttp-logging",
  "retrofit-kotlinx-serialization",
  "kotlinx-serialization-json",
]
camera = [
  "androidx-camera-core",
  "androidx-camera-camera2",
  "androidx-camera-lifecycle",
  "androidx-camera-view",
]
