# Project-wide Gradle settings.

# JVM args: 4 GB heap + metaspace keeps Kotlin/KSP happy on larger builds.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# KSP (faster than kapt for Hilt + Room)
ksp.use.worker.api=true

# Non-transitive R class — smaller per-module R, faster incremental builds.
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Don't upload any build scan info to Gradle Enterprise by default.
systemProp.gradle.enterprise.buildScan.uploadInBackground=false
